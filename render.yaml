databases:
  - name: tour-ledger-db
    plan: free

services:
  - type: web
    name: tour-ledger-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tour-ledger-db
          property: connectionString

  - type: web
    name: tour-ledger-app
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tour-ledger-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
